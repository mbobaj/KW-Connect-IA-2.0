<main class="container mx-auto p-4 sm:p-6">
  <app-header></app-header>

  <!-- View Navigation Tabs -->
  <div class="mb-6 flex justify-center">
    <div class="inline-flex items-center justify-center bg-gray-200 rounded-full p-1 space-x-1">
      <button
        (click)="setView('dashboard')"
        [class]="currentView() === 'dashboard'
          ? 'bg-white text-blue-600 shadow'
          : 'bg-transparent text-gray-600 hover:bg-gray-300/50'"
        class="whitespace-nowrap rounded-full py-2 px-5 font-medium text-sm transition-all duration-200 ease-in-out focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
        Dashboard
      </button>
      <button
        (click)="setView('supabaseReadings')"
        [class]="currentView() === 'supabaseReadings'
          ? 'bg-white text-blue-600 shadow'
          : 'bg-transparent text-gray-600 hover:bg-gray-300/50'"
        class="whitespace-nowrap rounded-full py-2 px-5 font-medium text-sm transition-all duration-200 ease-in-out focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
        Datos Supabase
      </button>
      <button
        (click)="setView('aiAssistant')"
        [class]="currentView() === 'aiAssistant'
          ? 'bg-white text-blue-600 shadow'
          : 'bg-transparent text-gray-600 hover:bg-gray-300/50'"
        class="whitespace-nowrap rounded-full py-2 px-5 font-medium text-sm transition-all duration-200 ease-in-out focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
        Asistente Ki-Wa
      </button>
    </div>
  </div>


  @if (currentView() === 'dashboard') {
    <!-- Dashboard View -->
    <div>
      <!-- KPI Cards Grid -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-6 mb-6">
        <app-kpi-card
          title="Consumo Actual"
          [value]="kpiCurrentConsumption()"
          unit="kWh"
          iconPath="M13 10V3L4 14h7v7l9-11h-7z">
        </app-kpi-card>
        <app-kpi-card
          title="Consumo Total Hoy"
          [value]="kpiTotalToday()"
          unit="kWh"
          iconPath="M9 17v-4h6v4H9zm2-2h2v-2h-2v2zM5 21V3h14v18H5zm2-2h10V5H7v14z">
        </app-kpi-card>
        <app-kpi-card
          title="Pico de Consumo Hoy"
          [value]="kpiPeakToday().value"
          [unit]="'kWh @ ' + kpiPeakToday().time"
          iconPath="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z">
        </app-kpi-card>
        <app-kpi-card
          title="Costo Mensual Est."
          [value]="kpiMonthlyCost()"
          unit="CLP"
          iconPath="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z">
        </app-kpi-card>
      </div>

      <!-- Layout Grid for Charts, Map, and Device List -->
      <div class="grid grid-cols-1 lg:grid-cols-5 gap-4 sm:gap-6">
        <div class="lg:col-span-3">
          <app-house-layout [devices]="devices()"></app-house-layout>
        </div>
        <div class="lg:col-span-2">
          <app-device-list [devices]="devices()" (setStatus)="handleSetDeviceStatus($event)"></app-device-list>
        </div>
        <div class="lg:col-span-3">
           <app-history-chart [data]="historyChartData()"></app-history-chart>
        </div>
        <div class="lg:col-span-2">
          <app-breakdown-chart [data]="breakdownChartData()"></app-breakdown-chart>
        </div>
      </div>
    </div>
  } @else if (currentView() === 'supabaseReadings') {
    <!-- Supabase Readings View -->
    <app-supabase-readings [readings]="supabaseService.allReadings()"></app-supabase-readings>
  } @else if (currentView() === 'aiAssistant') {
    <!-- AI Assistant View -->
    <app-ai-assistant [analysisContext]="aiAnalysisContext()"></app-ai-assistant>
  }
</main>
