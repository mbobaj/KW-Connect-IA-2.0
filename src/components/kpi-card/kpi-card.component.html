<div class="bg-white p-4 sm:p-6 rounded-2xl flex flex-col justify-between h-full shadow-md">
  <div class="flex items-start justify-between">
    <div>
      <p class="text-sm font-medium text-gray-500">{{ title() }}</p>
      <p class="text-4xl font-light text-gray-900 mt-1">
        {{ value() }}
      </p>
    </div>
    <div class="p-1">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="iconPath()" />
      </svg>
    </div>
  </div>
  <p class="text-sm font-medium text-gray-500 mt-2">{{ unit() }}</p>
</div>
