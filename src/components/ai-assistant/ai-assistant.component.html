<div class="bg-white p-4 sm:p-6 rounded-2xl shadow-md h-[75vh] flex flex-col">
  <h3 class="text-lg font-medium text-gray-800 mb-4">Asistente Ki-Wa</h3>

  <!-- Chat History -->
  <div #scrollContainer class="flex-grow overflow-y-auto mb-4 p-4 bg-gray-50 rounded-lg space-y-4">
    @for(message of messages(); track $index) {
      <div class="flex items-start space-x-3" [class.justify-end]="message.role === 'user'">
        @if (message.role === 'bot') {
          <div class="flex-shrink-0">
            <svg class="h-8 w-8 text-gray-400" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zM12 4c1.93 0 3.5 1.57 3.5 3.5S13.93 11 12 11s-3.5-1.57-3.5-3.5S10.07 4 12 4zm0 16c-2.21 0-4-1.79-4-4h8c0 2.21-1.79 4-4 4z"/>
            </svg>
          </div>
        }
        <div 
          class="rounded-2xl px-4 py-2 max-w-lg"
          [class]="message.role === 'user' 
            ? 'bg-blue-500 text-white rounded-br-none' 
            : 'bg-gray-200 text-gray-800 rounded-bl-none'">
          <p class="text-sm whitespace-pre-wrap">{{ message.content }}</p>
        </div>
      </div>
    }
    @if(isLoading()) {
       <div class="flex items-start space-x-3">
          <div class="flex-shrink-0">
            <svg class="h-8 w-8 text-gray-400" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zM12 4c1.93 0 3.5 1.57 3.5 3.5S13.93 11 12 11s-3.5-1.57-3.5-3.5S10.07 4 12 4zm0 16c-2.21 0-4-1.79-4-4h8c0 2.21-1.79 4-4 4z"/>
            </svg>
          </div>
          <div class="rounded-2xl px-4 py-2 max-w-lg bg-gray-200 text-gray-800 rounded-bl-none">
            <div class="flex items-center space-x-2">
              <div class="w-2 h-2 bg-gray-500 rounded-full animate-pulse"></div>
              <div class="w-2 h-2 bg-gray-500 rounded-full animate-pulse [animation-delay:0.2s]"></div>
              <div class="w-2 h-2 bg-gray-500 rounded-full animate-pulse [animation-delay:0.4s]"></div>
            </div>
          </div>
       </div>
    }
  </div>

  <!-- Input Area -->
  <div class="flex-shrink-0">
     <div class="flex items-center flex-wrap gap-2 mb-3">
       <button 
        (click)="analyzeConsumption()" 
        [disabled]="isLoading()"
        class="flex items-center space-x-2 bg-blue-100 text-blue-700 font-semibold py-2 px-3 rounded-full text-sm transition-colors duration-200 hover:bg-blue-200 disabled:opacity-50 disabled:cursor-not-allowed">
         <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
           <path d="M5 3a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2V5a2 2 0 00-2-2H5zM5 11a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2v-2a2 2 0 00-2-2H5zM11 5a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V5zM11 13a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
         </svg>
         <span>Analizar Consumo Actual</span>
       </button>
       <button (click)="getQuickTip()" [disabled]="isLoading()" class="flex items-center space-x-2 bg-gray-100 text-gray-700 font-semibold py-2 px-3 rounded-full text-sm transition-colors duration-200 hover:bg-gray-200 disabled:opacity-50 disabled:cursor-not-allowed">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path d="M10 2a1 1 0 011 1v1.268a2 2 0 000 3.464V16a1 1 0 11-2 0V7.732a2 2 0 000-3.464V3a1 1 0 011-1zM4 10a1 1 0 011-1h1a1 1 0 110 2H5a1 1 0 01-1-1zm10 0a1 1 0 011-1h1a1 1 0 110 2h-1a1 1 0 01-1-1zM6 14a1 1 0 011-1h1a1 1 0 110 2H7a1 1 0 01-1-1zm8 0a1 1 0 011-1h1a1 1 0 110 2h-1a1 1 0 01-1-1z" /></svg>
        <span>Dame un Consejo Rápido</span>
       </button>
       <button (click)="getHighestConsumer()" [disabled]="isLoading()" class="flex items-center space-x-2 bg-gray-100 text-gray-700 font-semibold py-2 px-3 rounded-full text-sm transition-colors duration-200 hover:bg-gray-200 disabled:opacity-50 disabled:cursor-not-allowed">
         <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9 4a1 1 0 012 0v5l4.293 4.293a1 1 0 01-1.414 1.414L9 11.414V4z" clip-rule="evenodd" /></svg>
         <span>¿Cuál es mi Mayor Gasto?</span>
       </button>
       <button (click)="getStandbyTips()" [disabled]="isLoading()" class="flex items-center space-x-2 bg-gray-100 text-gray-700 font-semibold py-2 px-3 rounded-full text-sm transition-colors duration-200 hover:bg-gray-200 disabled:opacity-50 disabled:cursor-not-allowed">
         <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path d="M8 3a1 1 0 011-1h2a1 1 0 110 2H9a1 1 0 01-1-1z" /><path d="M6 3a2 2 0 00-2 2v11a2 2 0 002 2h8a2 2 0 002-2V5a2 2 0 00-2-2 3 3 0 01-3 3H9a3 3 0 01-3-3z" /></svg>
         <span>Optimizar Standby</span>
       </button>
     </div>
     <div class="flex space-x-2">
       <input 
        type="text" 
        placeholder="Escribe tu pregunta aquí..."
        [value]="userInput()"
        (input)="userInput.set($event.target.value)"
        (keyup.enter)="sendMessage()"
        [disabled]="isLoading()"
        class="flex-grow w-full rounded-lg border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
       <button 
        (click)="sendMessage()" 
        [disabled]="isLoading() || userInput().trim() === ''"
        class="bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-4 rounded-lg text-sm transition-colors duration-200 disabled:bg-blue-300 disabled:cursor-not-allowed">
         Enviar
       </button>
     </div>
  </div>
</div>
