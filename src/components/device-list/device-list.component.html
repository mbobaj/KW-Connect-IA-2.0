
<div class="bg-slate-800 p-4 sm:p-6 rounded-2xl shadow-lg col-span-1 lg:col-span-2">
  <h3 class="text-lg font-semibold text-slate-100 mb-4">Device Control</h3>
  <div class="overflow-x-auto">
    <table class="w-full text-left">
      <thead>
        <tr class="border-b border-slate-700">
          <th class="p-2 sm:p-4 text-sm font-semibold text-slate-400">Device</th>
          <th class="p-2 sm:p-4 text-sm font-semibold text-slate-400 text-center">Consumption</th>
          <th class="p-2 sm:p-4 text-sm font-semibold text-slate-400 text-center">Status</th>
          <th class="p-2 sm:p-4 text-sm font-semibold text-slate-400 text-center">Action</th>
        </tr>
      </thead>
      <tbody>
        @for (device of devices(); track device.deviceName) {
          <tr class="border-b border-slate-700/50 hover:bg-slate-700/50">
            <td class="p-2 sm:p-4">
              <div class="flex items-center space-x-3">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-blue-400 hidden sm:block" fill="currentColor" viewBox="0 0 24 24">
                  <path [attr.d]="getIconPath(device.icon)"></path>
                </svg>
                <span class="font-medium text-slate-100">{{ device.deviceName }}</span>
              </div>
            </td>
            <td class="p-2 sm:p-4 text-center text-slate-300">
              {{ device.currentWattage }} W
            </td>
            <td class="p-2 sm:p-4 text-center">
              <span class="px-3 py-1 text-xs font-semibold rounded-full capitalize" [class]="getStatusColor(device.status)">
                {{ device.status }}
              </span>
            </td>
            <td class="p-2 sm:p-4 text-center">
              @if (device.status !== 'standby') {
                <label class="relative inline-flex items-center cursor-pointer">
                  <input type="checkbox" [checked]="device.status === 'on'" (change)="onToggle(device.deviceName)" class="sr-only peer">
                  <div class="w-11 h-6 bg-slate-600 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-orange-500"></div>
                </label>
              }
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
