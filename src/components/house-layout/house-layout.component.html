<div class="bg-white p-4 sm:p-6 rounded-2xl h-full min-h-[350px] flex flex-col shadow-md relative">
  <h3 class="text-lg font-medium text-gray-800 mb-4">Plano de la Casa</h3>
  <div class="flex-grow w-full h-full flex items-center justify-center">
    <svg viewBox="0 0 400 250" class="w-full h-full">
      <!-- Define shadow filter -->
      <defs>
        <filter id="dropshadow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
          <feOffset dx="1" dy="2" result="offsetblur"/>
          <feComponentTransfer>
            <feFuncA type="linear" slope="0.3"/>
          </feComponentTransfer>
          <feMerge> 
            <feMergeNode/>
            <feMergeNode in="SourceGraphic"/> 
          </feMerge>
        </filter>
      </defs>

      <!-- Floor Background -->
      <rect x="1" y="1" width="398" height="248" fill="#F8F9FA" stroke="none" />

      <!-- Walls -->
      <path d="
        M 10,10 H 390 V 240 H 10 Z
        M 10,10 V 240
        M 390,10 V 240
        M 10,10 H 390
        M 10,240 H 390
        M 140,10 V 100 H 100
        M 140,10 V 240
        M 280,10 V 160
        M 140,160 H 280
        " fill="none" stroke="#E5E7EB" stroke-width="3" stroke-linejoin="round" filter="url(#dropshadow)" />

      <!-- Doors -->
      <path d="M 140 130 A 30 30 0 0 1 110 160" fill="none" stroke="#E5E7EB" stroke-width="1" />
      <path d="M 250 160 A 30 30 0 0 0 280 130" fill="none" stroke="#E5E7EB" stroke-width="1" />

      <!-- Windows -->
      <rect x="40" y="9" width="60" height="2" fill="#EFF6FF" stroke="#E5E7EB" stroke-width="1" />
      <rect x="180" y="9" width="60" height="2" fill="#EFF6FF" stroke="#E5E7EB" stroke-width="1" />
      <rect x="399" y="100" width="2" height="60" fill="#EFF6FF" stroke="#E5E7EB" stroke-width="1" transform="rotate(90 400 130)" />

      <!-- Furniture -->
      <g fill="none" stroke="#E5E7EB" stroke-width="1">
        <rect x="25" y="40" width="80" height="50" />
        <rect x="25" y="100" width="15" height="15" />
        <rect x="25" y="170" width="70" height="40" />
        <rect x="155" y="40" width="110" height="50" />
        <rect x="185" y="105" width="50" height="30" />
        <rect x="155" y="145" width="70" height="10" />
        <path d="M 282,15 V 158 H 388 V 15" />
        <rect x="290" y="25" width="40" height="30" />
        <rect x="150" y="170" width="50" height="30" />
        <rect x="210" y="200" width="30" height="30" />
      </g>

      <!-- Room Labels -->
      <text x="75" y="8" font-family="Poppins, sans-serif" font-size="12" fill="#718096" text-anchor="middle">Dormitorio</text>
      <text x="210" y="8" font-family="Poppins, sans-serif" font-size="12" fill="#718096" text-anchor="middle">Living</text>
      <text x="335" y="8" font-family="Poppins, sans-serif" font-size="12" fill="#718096" text-anchor="middle">Cocina</text>
      <text x="210" y="180" font-family="Poppins, sans-serif" font-size="12" fill="#718096" text-anchor="middle">Baño</text>

      <!-- Devices -->
      <g>
        @for (device of devices(); track device.deviceId) {
          <g 
            [attr.transform]="'translate(' + device.position.x + ',' + device.position.y + ')'"
            (mouseover)="onDeviceMouseOver(device)"
            (mouseout)="onDeviceMouseOut()"
            class="cursor-pointer">
            <svg 
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24" 
              width="20"
              height="20"
              [class]="getStatusColorClass(device.status)"
              [class.device-pulse]="device.status === 'on'"
              fill="currentColor"
              [attr.x]="-10"
              [attr.y]="-10">
              @switch(device.icon) {
                @case('fridge') { <path d="M17 2H7c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 9h-3V5h3v6zm-5-6v6H8V5h3zm5 15H8v-6h8v6z"/> }
                @case('ac') { <path d="M19 15H5c-1.1 0-2-.9-2-2V7c0-1.1.9-2 2-2h14c1.1 0 2 .9 2 2v6c0 1.1-.9 2-2 2zM5 8v4h14V8H5zm14-5H5c-1.66 0-3 1.34-3 3v6c0 1.66 1.34 3 3 3h14c1.66 0 3-1.34 3-3V6c0-1.66-1.34-3-3-3zM18 11H6v-1h12v1zm-3-2H9V8h6v1z"/> }
                @case('tv') { <path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 1.99-.9 1.99-2L23 5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/> }
                @case('lights') { <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15.93V15h2v2.93c-1.16-.44-2-1.5-2-2.93zm1-13.93c-3.31 0-6 2.69-6 6s2.69 6 6 6v-2.18c-2.13-.44-3.62-2.39-3.62-4.82h1.62c0 1.54 1.25 2.8 2 2.8s2-1.26 2-2.8h1.62c0 2.43-1.49 4.38-3.62 4.82V10c3.31 0 6-2.69 6-6s-2.69-6-6-6z"/> }
                @case('microwave') { <path d="M22 6H2c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h20c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-2 10H4V8h16v8zm-5-7h-6v4h6v-4z"/> }
                @case('computer') { <path d="M20 18c1.1 0 1.99-.9 1.99-2L22 6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2H0v2h24v-2h-4zM4 6h16v10H4V6z"/> }
                @case('kettle') { <path d="M18.5 3H5.5C4.67 3 4 3.67 4 4.5V9h16V4.5C20 3.67 19.33 3 18.5 3zM6 7V5h12v2H6zm12 3H6c-1.66 0-3 1.34-3 3v7c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2v-4h1.5c1.93 0 3.5-1.57 3.5-3.5S20.43 10 18.5 10z"/> }
                @case('washing-machine') { <path d="M19 4H5C3.9 4 3 4.9 3 6v12c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-2 2h-2v2h2V6zm-4 0h-2v2h2V6zm-4 0H7v2h2V6zm8 12H7v-8h10v8zm-5-7c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/> }
              }
            </svg>
          </g>
        }
      </g>
    </svg>
  </div>
    
  <!-- Tooltip -->
  @if (hoveredDevice(); as device) {
    <div 
      class="absolute bg-gray-800 text-white text-sm rounded-lg px-3 py-2 shadow-lg pointer-events-none transition-opacity duration-200"
      [style.left.px]="device.position.x + 15"
      [style.top.px]="device.position.y - 15">
      <p class="font-semibold">{{ device.deviceName }}</p>
      <p>{{ device.currentWattage }} W</p>
      @if(device.temperature !== undefined && device.temperature !== null) {
        <p class="text-xs text-gray-300">{{ device.temperature.toFixed(1) }} °C / {{ device.humidity?.toFixed(0) }} %</p>
      }
    </div>
  }
</div>
